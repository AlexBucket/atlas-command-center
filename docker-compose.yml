version: "3.8"

services:
  atlas-command-center:
    build: .
    container_name: atlas-command-center-v3
    restart: unless-stopped
    ports:
      - "3006:3006"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /root/.hermes:/root/.hermes:ro
    networks:
      - atlas-media_default

networks:
  atlas-media_default:
    external: true