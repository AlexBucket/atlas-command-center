<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Atlas v3{% endblock %}</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="stylesheet" href="/static/css/dashboard.css">
<script defer src="/static/js/alpine.min.js"></script>
</head>
<body>

<!-- Shift Bar (persistent across all pages) -->
<div id="shift-bar"
     class="shift-bar shift-off"
     x-data="shiftWidget()"
     x-init="fetchShift()"
     :class="'shift-'+ shiftClass">
  <div class="shift-icon" x-text="icon"></div>
  <div class="shift-info">
    <span class="shift-label" x-text="label">Off Shift</span>
    <span class="shift-time" x-show="shift_start">· on at <span x-text="shift_start"></span></span>
  </div>
  <div class="shift-detail" x-text="cycle_progress"></div>
  <div class="shift-alarm" x-show="alarm_time">
    <span class="alarm-icon">⏰</span>
    <span x-text="'Alarm: '+alarm_time"></span>
  </div>
</div>

<!-- Sidebar -->
<nav class="sidebar">
  <div class="sidebar-brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    Project Atlas <span>v3</span>
    <span class="beta-badge">beta</span>
  </div>

  <div class="nav-section">
    <div class="nav-section-title">Dashboard</div>
    <a href="/" class="nav-item {% if page == 'overview' %}active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Overview
    </a>
    <a href="/infra" class="nav-item {% if page == 'infra' %}active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><circle cx="6" cy="6" r="1"/><circle cx="6" cy="18" r="1"/></svg>
      Infrastructure
    </a>
    <a href="/media" class="nav-item {% if page == 'media' %}active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
      Media
    </a>
    <a href="/network" class="nav-item {% if page == 'network' %}active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.858 15.355-5.858 21.213 0"/></svg>
      Network
    </a>
    <a href="/games" class="nav-item {% if page == 'games' %}active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Games
    </a>
    <a href="/github" class="nav-item {% if page == 'github' %}active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>
      GitHub
    </a>
    <a href="/intelligence" class="nav-item {% if page == 'intelligence' %}active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4m-10-10h4m12 0h4"/></svg>
      Intelligence
    </a>
  </div>

  <!-- Sidebar bottom: health indicator + version -->
  <div class="sidebar-footer">
    <div class="health-row" x-data="healthWidget()" x-init="fetchHealth()">
      <span class="health-dot" :class="'health-'+healthStatus"></span>
      <span class="health-text" x-text="healthLabel"></span>
    </div>
    <div class="version-info">
      <span class="dot dot-green" style="width:5px;height:5px"></span>
      <span id="container-count" x-data="{ n:0 }" x-init="fetch('/api/overview').then(r=>r.json()).then(r=>{ n=r.data?.docker?.running||0 }).catch(()=>{})" x-text="n+' containers'">0 containers</span>
    </div>
  </div>
</nav>

<!-- Main Content -->
<main class="main fade-in">
  {% block content %}{% endblock %}
</main>

<!-- Bottom Status Bar -->
<div class="status-bar">
  <div class="status-bar-left">
    <span class="beta-badge" style="font-size:9px;padding:1px 6px">v3 beta</span>
    <span class="status-bar-sep"></span>
    <span x-data="{ n:0 }" x-init="fetch('/api/overview').then(r=>r.json()).then(r=>{ n=r.data?.docker?.running||0 }).catch(()=>{})" x-text="n+' containers healthy'">0 containers healthy</span>
  </div>
  <div class="status-bar-right">
    <span id="status-version">Atlas v3.0.0</span>
    <span class="status-bar-sep"></span>
    <span x-data="{ t:'' }" x-init="t=new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'})" x-text="t"></span>
  </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.store('data', { overview: null, loaded: false });

  // Shift widget — single source of truth, matches /api/shift response
  Alpine.data('shiftWidget', () => ({
    loaded: false, shiftClass: 'off', icon: '💤', label: 'Off Shift',
    shift_start: '', alarm_time: '', cycle_progress: '',
    fetchShift() {
      fetch('/api/shift').then(r => r.json()).then(r => {
        const s = r.data || {};
        const sh = (s.shift || 'Off');
        this.shiftClass = sh.toLowerCase();
        this.icon = sh === 'Night' ? '🌙' : sh === 'Day' ? '☀️' : '💤';
        this.label = s.detail || (sh + ' Shift');
        this.shift_start = s.shift_start || '';
        this.alarm_time = s.alarm_time || '';
        this.cycle_progress = s.cycle_progress || '';
        this.loaded = true;
      }).catch(() => { this.loaded = true; });
    }
  }));

  // Health widget
  Alpine.data('healthWidget', () => ({
    healthStatus: 'unknown',
    healthLabel: 'Checking...',
    fetchHealth() {
      fetch('/api/overview').then(r => r.json()).then(r => {
        const d = r.data || {};
        const running = d.docker?.running || 0;
        const total = d.docker?.total || 0;
        const errors = d.docker?.errors || 0;
        if (errors > 0) {
          this.healthStatus = 'degraded';
          this.healthLabel = errors + ' unhealthy';
        } else if (running === total && total > 0) {
          this.healthStatus = 'healthy';
          this.healthLabel = 'All systems nominal';
        } else if (total > 0) {
          this.healthStatus = 'degraded';
          this.healthLabel = running + '/' + total + ' running';
        } else {
          this.healthStatus = 'unknown';
          this.healthLabel = 'Checking...';
        }
      }).catch(() => { this.healthStatus = 'error'; this.healthLabel = 'Offline'; });
    }
  }));
});
</script>
</body>
</html>
